<title>Kafka Deep Dive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky module rail on the left, single reading column ~68ch on the right; stacks to one column under 900px */
:root{
  --paper:#F2F3EF; --panel:#FBFBF9; --sunk:#E8EAE4;
  --ink:#1A1D21; --ink-2:#3C434B; --muted:#6B737C;
  --rule:#D5D8D1; --rule-strong:#B9BEB6;
  --accent:#1D6B61; --accent-soft:#DCE9E6;
  --warn:#9E4B18; --warn-soft:#F2E3D8;
  --font-display:"Chivo","Helvetica Neue",Arial,sans-serif;
  --font-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15171A; --panel:#1C1F23; --sunk:#23272C;
  --ink:#E9EBE6; --ink-2:#C3C9CE; --muted:#929AA2;
  --rule:#2C3137; --rule-strong:#3D444B;
  --accent:#58B6A7; --accent-soft:#1B312E;
  --warn:#D98B52; --warn-soft:#33241A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#15171A; --panel:#1C1F23; --sunk:#23272C;
  --ink:#E9EBE6; --ink-2:#C3C9CE; --muted:#929AA2;
  --rule:#2C3137; --rule-strong:#3D444B;
  --accent:#58B6A7; --accent-soft:#1B312E;
  --warn:#D98B52; --warn-soft:#33241A;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
.shell{display:grid; grid-template-columns:260px minmax(0,1fr); gap:0; max-width:1180px; margin:0 auto}

.rail{
  border-right:1px solid var(--rule);
  padding:28px 20px 48px; align-self:start;
  position:sticky; top:env(safe-area-inset-top,0px);
  max-height:100vh; overflow-y:auto;
}
.brand{font-family:var(--font-display); font-weight:900; font-size:19px; letter-spacing:-.02em; line-height:1.15; margin:0 0 2px}
.brand span{color:var(--accent)}
.brand-sub{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:0 0 22px}
.rail h3{font-family:var(--font-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); margin:22px 0 8px; font-weight:600}
.rail nav{display:flex; flex-direction:column; gap:1px}
.rail nav a{
  display:flex; gap:9px; align-items:baseline;
  font-family:var(--font-display); font-size:13.5px; font-weight:500;
  color:var(--ink-2); text-decoration:none; padding:5px 8px; border-radius:3px; min-width:0;
}
.rail nav a:hover{background:var(--sunk); color:var(--ink)}
.rail nav a .n{font-family:var(--font-mono); font-size:10.5px; color:var(--muted); flex:0 0 22px; font-weight:500}
.rail nav a.done .n{color:var(--accent)}
.rail nav a.todo{color:var(--muted)}
.rail nav a.todo .n{opacity:.6}
.rail nav a.wip .n{color:var(--warn)}
.legend i{color:var(--warn); font-style:normal}
.legend{font-family:var(--font-mono); font-size:10px; color:var(--muted); margin-top:20px; line-height:1.9; border-top:1px solid var(--rule); padding-top:14px}
.legend b{color:var(--accent); font-weight:500}
.repo-link{font-family:var(--font-mono); font-size:10px; margin-top:12px}

main{padding:40px 44px 96px; min-width:0}
main.solo{max-width:900px; margin:0 auto; padding:40px 24px 96px}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); font-weight:600; margin:0 0 10px}
h1{font-family:var(--font-display); font-weight:900; font-size:clamp(30px,4.6vw,44px); line-height:1.06; letter-spacing:-.025em; margin:0 0 14px; text-wrap:balance}
.lede{font-size:19px; color:var(--ink-2); max-width:62ch; margin:0 0 8px}
h2{font-family:var(--font-display); font-weight:700; font-size:25px; letter-spacing:-.015em; margin:56px 0 4px; padding-top:22px; border-top:2px solid var(--ink); text-wrap:balance}
h3{font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-.01em; margin:34px 0 6px; text-wrap:balance}
p{margin:10px 0; max-width:68ch}
a{color:var(--accent)}
code{font-family:var(--font-mono); font-size:.86em; background:var(--sunk); padding:1.5px 5px; border-radius:3px}
strong{font-weight:600}
ul,ol{max-width:68ch; padding-left:22px; margin:10px 0}
li{margin:5px 0}
hr{border:0; border-top:1px solid var(--rule); margin:40px 0}

.scroll{overflow-x:auto; margin:18px 0; border:1px solid var(--rule); border-radius:5px; background:var(--panel)}
table{border-collapse:collapse; width:100%; font-size:14.5px; font-family:var(--font-display)}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--rule); vertical-align:top}
thead th{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--sunk); white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td code{background:transparent; padding:0; color:var(--accent)}
.num{font-variant-numeric:tabular-nums; font-family:var(--font-mono)}

pre{
  font-family:var(--font-mono); font-size:13px; line-height:1.62;
  background:var(--panel); border:1px solid var(--rule); border-left:2px solid var(--accent);
  border-radius:4px; padding:14px 16px; overflow-x:auto; margin:16px 0; color:var(--ink-2);
}
pre b{color:var(--ink); font-weight:600}
pre .c{color:var(--muted)}

.callout{border:1px solid var(--rule); border-left:3px solid var(--accent); background:var(--panel); border-radius:4px; padding:14px 18px; margin:20px 0}
.callout.warn{border-left-color:var(--warn); background:var(--warn-soft)}
.callout .tag{font-family:var(--font-mono); font-size:10px; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--accent); display:block; margin-bottom:5px}
.callout.warn .tag{color:var(--warn)}
.callout p{margin:5px 0; max-width:62ch}
.callout :first-child{margin-top:0} .callout :last-child{margin-bottom:0}

.logstrip{display:flex; flex-direction:column; gap:7px; margin:20px 0; font-family:var(--font-mono); font-size:11.5px}
.logrow{display:flex; align-items:center; gap:9px; min-width:0}
.logrow .plabel{flex:0 0 72px; color:var(--muted); letter-spacing:.04em}
.cells{display:flex; gap:3px; flex-wrap:wrap; min-width:0}
.cell{width:30px; height:26px; display:grid; place-items:center; background:var(--sunk); border:1px solid var(--rule); border-radius:2px; color:var(--ink-2); font-size:10.5px; font-variant-numeric:tabular-nums}
.cell.hw{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600}
.cell.empty{background:transparent; border-style:dashed; color:transparent}
.logrow .owner{flex:0 0 auto; color:var(--accent); font-size:10.5px; letter-spacing:.04em}
.logrow .owner.idle{color:var(--warn)}

.tool{border:1px solid var(--rule-strong); border-radius:6px; background:var(--panel); padding:20px; margin:24px 0}
.tool-head{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:14px}
.fields{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.field input{
  font-family:var(--font-mono); font-size:14px; padding:7px 10px; width:150px; max-width:100%;
  background:var(--paper); color:var(--ink); border:1px solid var(--rule-strong); border-radius:3px;
}
.field input:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.field input[type=number]{width:90px}
.result{margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-family:var(--font-mono); font-size:13px}
.chip{border:1px solid var(--rule-strong); border-radius:3px; padding:6px 11px; background:var(--paper); font-variant-numeric:tabular-nums}
.chip b{color:var(--accent); font-weight:600}
.verdict{font-family:var(--font-display); font-size:14px; font-weight:500; margin-top:12px}
.verdict.moved{color:var(--warn)}
.verdict.kept{color:var(--accent)}

.qlist{list-style:none; padding:0; margin:18px 0; max-width:none}
.qlist li{border:1px solid var(--rule); border-radius:5px; background:var(--panel); margin:7px 0; padding:0}
.qlist label{display:flex; gap:12px; align-items:flex-start; padding:12px 15px; cursor:pointer}
.qlist input{margin:4px 0 0; accent-color:var(--accent); flex:0 0 auto; width:15px; height:15px}
.qlist .qtext{font-size:15.5px; min-width:0}
.qlist .lvl{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:3px}
.qlist .lvl.hard{color:var(--warn)}
.qlist input:checked + .qtext{color:var(--muted); text-decoration:line-through var(--rule-strong)}
.qmeta{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-top:10px}

/* lab worksheet */
.step{border:1px solid var(--rule); border-radius:6px; background:var(--panel); padding:0 22px 18px; margin:26px 0}
.step > h3{display:flex; gap:12px; align-items:baseline; margin:0 -22px 4px; padding:14px 22px; border-bottom:1px solid var(--rule); background:var(--sunk); border-radius:5px 5px 0 0}
.step > h3 .sn{font-family:var(--font-mono); font-size:11px; color:var(--accent); flex:0 0 auto; letter-spacing:.06em}
.step h4{font-family:var(--font-mono); font-weight:600; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:20px 0 4px}
.step h4.predict{color:var(--warn)}
.step > :last-child{margin-bottom:0}
.predict-box{border-left:3px solid var(--warn); background:var(--warn-soft); border-radius:3px; padding:11px 15px; margin:8px 0}
.predict-box p{margin:4px 0; max-width:62ch}
.predict-box :first-child{margin-top:0} .predict-box :last-child{margin-bottom:0}
.labtrack{list-style:none; padding:0; margin:0}
.labtrack li{border:0; background:transparent; margin:0}
.labtrack label{display:flex; gap:10px; align-items:center; padding:0; cursor:pointer; font-family:var(--font-mono); font-size:11px; color:var(--muted)}
.labtrack input{accent-color:var(--accent); width:14px; height:14px; margin:0}
.labtrack input:checked + span{color:var(--accent)}
.backlink{font-family:var(--font-mono); font-size:11px; margin:0 0 18px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--rule); padding:26px 20px 22px}
  .rail nav{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:1px}
  main{padding:30px 20px 80px}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
